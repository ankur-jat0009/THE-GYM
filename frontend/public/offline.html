<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=/">
  <title>THE GYM</title>
  <script>
    // Permanently unregister any old offline service workers and return to app
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.update();
        }
      });
    }
    window.location.replace('/');
  </script>
</head>
<body style="background:#000; margin:0; display:flex; align-items:center; justify-content:center; height:100vh; color:#fff; font-family:sans-serif;">
  <p>Connecting to THE GYM...</p>
</body>
</html>
